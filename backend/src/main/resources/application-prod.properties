# Production Profile - PostgreSQL Database
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Console disabled for production
spring.h2.console.enabled=false

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://db:5432/tenantdb}
spring.datasource.username=${POSTGRES_USER:tenant}
spring.datasource.password=${POSTGRES_PASSWORD:tenant}

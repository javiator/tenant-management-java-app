services:
  db:
    image: postgres:16
    container_name: tenantmgmt_db
    environment:
      POSTGRES_DB: tenantdb
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tenant -d tenantdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - prod

  api:
    build: .
    container_name: tenantmgmt_api_mod
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://db:5432/tenantdb}
      POSTGRES_USER: ${POSTGRES_USER:-tenant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenant}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "8080:8080"
    volumes:
      - h2-data:/app/data

volumes:
  pgdata:
  h2-data:



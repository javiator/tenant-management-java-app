version: 0.0
os: linux
files:
  - source: backend/target/tenant-management-0.0.1-SNAPSHOT.jar
    destination: /home/ec2-user/app/
  - source: frontend/build/
    destination: /var/www/html/
  - source: scripts/
    destination: /home/ec2-user/scripts/
hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: root
